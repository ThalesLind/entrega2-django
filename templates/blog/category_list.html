{% extends 'base.html' %}

{% block content %}
    <h1>Categorias</h1>
    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category_detail' category.pk %}"><strong>{{ category.name }}</strong></a>
                <p>{{ category.description }}</p>
            </li>
        {% empty %}
            <li>Nenhuma categoria cadastrada.</li>
        {% endfor %}
    </ul>
{% endblock %}
