{% extends 'base.html' %}

{% block content %}
    <h1>Confirmar Remoção</h1>
    <p>Tem certeza que deseja excluir o post <strong>"{{ post.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar Exclusão</button>
        <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
    </form>
{% endblock %}
